<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span class="value" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="label">AI</span>
                <span class="value" id="aiScore">0</span>
            </div>
        </div>
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong> Use Mouse Y-position or Arrow Keys (↑/↓) to move your paddle</p>
            <p><strong>Goal:</strong> Score points by getting the ball past the opponent's paddle</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
